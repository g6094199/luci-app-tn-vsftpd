name: Build luci-app-tn-vsftpd

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: [kirkwood, x86_64, aarch64_generic, mipsel_24kc, ramips_mt7621] # Wichtige Architekturen -  Ziel-Architektur (z.B. aarch64_generic)
          FEEDNAME: custom
          PACKAGES: luci-app-tn-vsftpd

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-tn-vsftpd-apk
          path: bin/packages/*/custom/*.apk # 25.12 nutzt .apk Dateien!
