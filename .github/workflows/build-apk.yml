name: Build luci-app-vsftpd-wt & Create Feed

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Package and Create Index
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64
          FEEDNAME: custom
          PACKAGES: luci-app-vsftpd-wt
          IGNORE_ERRORS: y
        with:
          # Dieser Befehl läuft INNERHALB des SDK-Containers
          commands: |
            make package/luci-app-vsftpd-wt/compile
            cd bin/packages/x86_64/custom
            apk index --allow-untrusted -o APKINDEX.tar.gz *.apk

      - name: Prepare Deploy Directory
        run: |
          mkdir -p deploy/x86_64/custom
          # Die Dateien liegen im Workspace-Verzeichnis, das vom SDK-Schritt befüllt wurde
          cp bin/packages/x86_64/custom/*.apk deploy/x86_64/custom/
          cp bin/packages/x86_64/custom/APKINDEX.tar.gz deploy/x86_64/custom/

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true

