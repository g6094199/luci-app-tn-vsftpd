name: Build luci-app-vsftpd-wt & Create Feed

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64
          FEEDNAME: custom
          PACKAGES: luci-app-vsftpd-wt
          IGNORE_ERRORS: y

      - name: Create Feed Index using SDK Tools
        run: |
          # 1. Verzeichnisse vorbereiten
          mkdir -p deploy/x86_64/custom
          cp bin/packages/x86_64/custom/*.apk deploy/x86_64/custom/
          
          # 2. Das spezialisierte APK-Tool aus dem SDK-Staging-Verzeichnis finden
          # In der GitHub Action Umgebung liegt das SDK unter dem Pfad des Runners
          SDK_APK=$(find staging_dir/host/bin/ -name apk -type f | head -n 1)
          
          if [ -n "$SDK_APK" ]; then
            echo "Nutze SDK-Tool: $SDK_APK"
            # Den Index mit dem echten OpenWrt-Tool erstellen
            $SDK_APK index --allow-untrusted -o deploy/x86_64/custom/APKINDEX.tar.gz deploy/x86_64/custom/*.apk
          else
            echo "Fehler: SDK apk-Tool nicht gefunden. Erstelle einfachen Index."
            cd deploy/x86_64/custom && tar -cvzf APKINDEX.tar.gz *.apk
          fi

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true

