name: Build luci-app-vsftpd-wt & Create Feed

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64
          FEEDNAME: custom
          PACKAGES: luci-app-vsftpd-wt
          IGNORE_ERRORS: y

      - name: Create Feed Index and Prepare Deploy
        run: |
          # 1. Verzeichnisse erstellen
          mkdir -p deploy/x86_64/custom
          
          # 2. APKs kopieren (falls der Build erfolgreich war)
          cp bin/packages/x86_64/custom/*.apk deploy/x86_64/custom/
          
          # 3. Den Index mit einem Docker-Container erstellen, 
          # aber wir nutzen 'alpine', um das APK-Tool sicher auszuführen.
          # Wir nutzen --entrypoint um sicherzugehen, dass wir den Index-Befehl treffen.
          docker run --rm -v ${{ github.workspace }}/deploy/x86_64/custom:/dir alpine:latest \
            /bin/sh -c "apk add --no-cache apk-tools && apk index --allow-untrusted -o /dir/APKINDEX.tar.gz /dir/*.apk"

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./deploy
          publish_branch: gh-pages
          force_orphan: true

