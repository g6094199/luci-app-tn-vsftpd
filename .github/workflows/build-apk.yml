name: Build luci-app-vsftpd-wt

on:
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Package
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: x86_64 # Ein SDK reicht für PKGARCH:=all aus
          FEEDNAME: custom
          PACKAGES: luci-app-vsftpd-wt 
          IGNORE_ERRORS: y

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-vsftpd-wt-apk
          path: bin/packages/*/custom/*.apk

